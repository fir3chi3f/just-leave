name: Build

# Runs when a GitHub release is published, and attaches the signed APK to that release.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the APK to the release
    steps:
      - uses: actions/checkout@v7

      # The build targets Java 25 (see app/build.gradle.kts).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JUST_LEAVE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Gradle reads ORG_GRADLE_PROJECT_* variables as the signing properties in app/build.gradle.kts.
      - name: Test and build signed release APK
        env:
          ORG_GRADLE_PROJECT_justLeaveStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_justLeaveStorePassword: ${{ secrets.JUST_LEAVE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_justLeaveKeyAlias: just-leave
          ORG_GRADLE_PROJECT_justLeaveKeyPassword: ${{ secrets.JUST_LEAVE_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Name the APK after the release
        run: cp app/build/outputs/apk/release/app-release.apk "just-leave-${{ github.event.release.tag_name || github.sha }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: just-leave-release-apk
          path: just-leave-*.apk

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" just-leave-*.apk
